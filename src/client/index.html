<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b16" />
    <title>Alumbrado adaptativo</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="/vendor/chart.umd.js"></script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Alumbrado adaptativo</h1>
        <p>Grupo 10, Modelos y Simulación</p>
      </div>
      <span class="pill" id="board-status">Sin conexión con la placa</span>
    </header>

    <main>
      <section class="screen" id="monitor" data-active="true"></section>
      <section class="screen" id="analysis"></section>
      <section class="screen" id="simulation"></section>
    </main>

    <nav class="tabbar glass" aria-label="Secciones">
      <button data-screen="monitor" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M5.6 5.6l1.4 1.4M3 12h2M18.4 5.6 17 7M21 12h-2M8 16a4 4 0 1 1 8 0v2H8z M10 21h4" /></svg>
        <span>Monitoreo</span>
      </button>
      <button data-screen="analysis">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
        <span>Análisis</span>
      </button>
      <button data-screen="simulation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" /></svg>
        <span>Simulación</span>
      </button>
    </nav>
  </body>
</html>
