<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b16" />
    <title>Alumbrado adaptativo</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="/vendor/chart.umd.js"></script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>Alumbrado adaptativo</h1>
      <div class="topbar-actions">
        <span class="pill" id="board-status">Sin conexión con la placa</span>
        <div class="menu">
          <button class="icon-button glass" id="menu-button" aria-label="Exportar datos" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" /></svg>
          </button>
          <div class="menu-panel glass" id="menu-panel" hidden>
            <span class="menu-title">Exportar CSV</span>
            <a href="/api/export/resumen_noches.csv" download>Resumen de noches</a>
            <a href="/api/export/lecturas_maqueta.csv" download>Lecturas de la maqueta</a>
            <a href="/api/export/calibracion.csv" download>Calibración</a>
            <a href="/api/export/simulacion_por_minuto.csv" download>Simulaciones</a>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="screen" id="monitor" data-active="true"></section>
      <section class="screen" id="analysis"></section>
      <section class="screen" id="simulation"></section>
    </main>

    <nav class="tabbar glass" aria-label="Secciones">
      <button data-screen="monitor" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M5.6 5.6l1.4 1.4M3 12h2M18.4 5.6 17 7M21 12h-2M8 16a4 4 0 1 1 8 0v2H8z M10 21h4" /></svg>
        <span>Monitoreo</span>
      </button>
      <button data-screen="analysis">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
        <span>Análisis</span>
      </button>
      <button data-screen="simulation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" /></svg>
        <span>Simulación</span>
      </button>
    </nav>
  </body>
</html>
